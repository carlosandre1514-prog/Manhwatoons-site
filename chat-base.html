<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chat da comunidade (base visual)</title>
<style>
:root{--bg:#000;--sf:#0e0e0e;--sf2:#1c1c1c;--tx:#f4f4f4;--mu:#b3b3b3;--gold:#00e05c;--bd:#262626;--on:#000}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:18px}header small{color:var(--mu)}header i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:6px}
#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:12px}
.m{display:flex;gap:10px;max-width:86%}.m .f{width:36px;height:36px;border-radius:50%;background:var(--sf2) center/cover;flex:none;display:grid;place-items:center;font-weight:800;color:var(--gold)}
.m .b{background:var(--sf);border:1px solid var(--bd);border-radius:4px 16px 16px 16px;padding:8px 12px}.m .n{font-size:12px;color:var(--mu);margin-bottom:2px}.m .n b{color:var(--gold)}
.m.me{align-self:flex-end;flex-direction:row-reverse}.m.me .b{background:var(--gold);color:var(--on);border-color:var(--gold);border-radius:16px 4px 16px 16px}.m.me .n,.m.me .f{display:none}
.dia{align-self:center;color:var(--mu);font-size:12px}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);background:var(--bg)}
input{flex:1;min-width:0;background:var(--sf);border:1px solid var(--bd);border-radius:999px;color:var(--tx);padding:12px 16px;font:inherit}
button{border:0;border-radius:999px;background:var(--gold);color:var(--on);font-weight:800;padding:0 20px;font:inherit;font-weight:800}
</style></head><body>
<header><h1>Comunidade</h1><small><i></i>128 online</small></header>
<div id="msgs">
<div class="dia">Hoje</div>
<div class="m"><div class="f">L</div><div class="b"><div class="n"><b>Léo</b> · 09:12</div>Alguém já leu o capítulo novo de Solo Leveling?</div></div>
<div class="m"><div class="f">A</div><div class="b"><div class="n"><b>Ana</b> · 09:14</div>Acabei de ler, o final do capítulo foi demais!</div></div>
<div class="m me"><div class="b">Vou ler agora, sem spoiler 😅</div></div>
</div>
<form id="f"><input id="t" placeholder="Escreva uma mensagem…" autocomplete="off"><button>Enviar</button></form>
<script>
f.onsubmit=e=>{e.preventDefault();const v=t.value.trim();if(!v)return;const d=document.createElement("div");d.className="m me";d.innerHTML='<div class="b"></div>';d.firstChild.textContent=v;msgs.append(d);t.value="";msgs.scrollTop=msgs.scrollHeight}
</script></body></html>
